<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Dashboard - Skooler</title>

		<!-- SVG-favicon direkte i HTML som fyller hele ikonet uten luft -->
		<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'><path fill='%230b72b9' d='M50 0C22.4 0 0 22.4 0 50s22.4 50 50 50c18.8 0 35.1-10.4 43.6-25.8C102.1 89.6 118.4 100 137.2 100c27.6 0 50-22.4 50-50S164.8 0 137.2 0c-18.8 0-35.1 10.4-43.6 25.8C85.1 10.4 68.8 0 50 0zm0 25c13.8 0 25 11.2 25 25S63.8 75 50 75 25 63.8 25 50s11.2-25 25-25zm87.2 0c13.8 0 25 11.2 25 25s-11.2 25-25 25-25-11.2-25-25 11.2-25 25-25z'/></svg>" />
	
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		
		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<div title="Skooler Logo" class="flex-center logo-wrapper header-center">
			<img class="logo" src="favicon.png" alt="Skooler" />
			<h1>Skooler</h1>
		</div>
		<div class="flex-center desc left-margin">
			<p>
				Søk eller skriv inn en nettadresse for å fortsette.
			</p>
		</div>

		<form id="sj-form" class="flex-center">
			<input
				id="sj-search-engine"
				value="https://www.google.com/search?q=%s"
				type="hidden"
			/>
			<input id="sj-address" type="text" placeholder="Søk eller skriv inn URL..." />
		</form>
		<div class="desc left-margin">
			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>
		</div>
		<footer>
			<div>
				<a title="Skooler Hjelp" href="#">Hjelp</a>
				<a title="Personvern" href="#">Personvern</a>
				<a title="Vilkår" href="#">Vilkår</a>
			</div>
			<div>
				<span>Skooler &copy; 2026</span>
			</div>
		</footer>
	</body>
</html>
